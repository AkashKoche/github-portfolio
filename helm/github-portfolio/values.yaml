replicaCount: 3

nameOverride: ""
fullnameOverride: ""

image:
  repository: akashkoche/github-portfolio
  pullPolicy: IfNotPresent
  tag: "1.0.1"


service:
  type: ClusterIP
  port: 80


resources:
  requests:
    memory: "64Mi"
    cpu: "100m"
  limits:
    memory: "128Mi"
    cpu: "200m"


autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

secret:
  enabled: true
  viteGithubToken: ""

config:
  appName: "GitHub-Portfolio"
  cacheDuration: "300"
