apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "github-portfolio.fullname" . }}-network-policy
  labels:
    {{- include "github-portfolio.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "github-portfolio.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - port: 80
          protocol: TCP
  egress:
    - ports:
        - protocol: TCP
          port: 443
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
