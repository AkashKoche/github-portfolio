apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "github-portfolio.fullname" . }}-config
  labels:
    app.kubernetes.io/name: {{ include "github-portfolio.name" . }}
    helm.sh/chart: {{ include "github-portfolio.chart" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Service }}
data:
  APP_NAME: {{ .Values.config.appName | quote }}
  CACHE_DURATION: {{ .Values.config.cacheDuration | quote }}
