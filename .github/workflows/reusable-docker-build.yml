name: Reusable Docker Build & Sign

on:
  workflow_call:
    inputs:
      image_name:
        required: true
        type: string
        description: "Full image name without tag (e.g. akashkoche/github-portfolio)"
      registry:
        required: false
        type: string
        default: ""
        description: "Docker registry (leave empty for Docker Hub)"
      target_stage:
        required: false
        type: string
        default: "builder"
      tags:
        required: false
        type: string
        default: "latest"
      build_args:
        required: false
        type: string
        default: ""
    secrets:
      registry_username:
        required: false
      registry_password:
        required: false
      cosign_private_key:
        required: false
      cosign_password:
        required: false

jobs:
  build-and-sign:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Registry
        if: ${{ env.REGISTRY_USERNAME != '' }}
        env:
          REGISTRY_USERNAME: ${{ secrets.registry_username }}
        uses: docker/login-action@v3
        with:
          registry: ${{ inputs.registry }}
          username: ${{ secrets.registry_username }}
          password: ${{ secrets.registry_password }}

      - name: Extract Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ inputs.image_name }}
          tags: ${{ inputs.tags }}

      - name: Build and Push
        id: build-and-push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ inputs.target_stage }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ inputs.build_args }}

      - name: Run Trivy Vulnerability Scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ inputs.image_name }}:${{ inputs.tags }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Install Cosign
        if: ${{ env.COSIGN_PRIVATE_KEY != '' }}
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.cosign_private_key }}
        uses: sigstore/cosign-installer@v3.5.0

      - name: Sign Container Image
        if: ${{ env.COSIGN_PRIVATE_KEY != '' }}
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.cosign_private_key }}
          COSIGN_PASSWORD: ${{ secrets.cosign_password }}
        run: |
          cosign sign --yes --key env://COSIGN_PRIVATE_KEY ${{ inputs.image_name }}@${{ steps.build-and-push.outputs.digest }}
