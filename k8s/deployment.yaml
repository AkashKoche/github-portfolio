apiVersion: apps/v1
kind: Deployment
metadata:
  name: github-portfolio
  namespace: github-portfolio
  labels:
    app: github-portfolio
spec:
  replicas: 3
  selector:
    matchLabels:
      app: github-portfolio
  template:
    metadata:
      labels:
        app: github-portfolio
    spec:
      containers:
      - name: app
        image: akashkoche/github-portfolio:1.0.1
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
          name: http
        env:
        - name: VITE_GITHUB_TOKEN
          valueFrom:
            secretKeyRef:
              name: github-token
              key: VITE_GITHUB_TOKEN
              optional: true
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 3
          periodSeconds: 5
