apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: github-portfolio-hpa
  namespace: github-portfolio
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: github-portfolio
  minReplicas: 2
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
